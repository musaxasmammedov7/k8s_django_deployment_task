# =============================================================================
# Helmfile: Secure Kubernetes Deployment Orchestration
# =============================================================================
# Deploys:
#   1. metrics-server  (Resource usage metrics for HPA)
#   2. ingress-nginx   (AWS Network Load Balancer ingress controller)
#   3. cert-manager    (Let's Encrypt TLS certificate automation)
#   4. django-secure   (Hardened Django application with Pod Security Standards,
#                       NetworkPolicy, RBAC, and SOPS-encrypted secrets)
# =============================================================================

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/

helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true

releases:
  # ---------------------------------------------------------------------------
  # 1. Metrics Server
  # ---------------------------------------------------------------------------
  - name: metrics-server
    namespace: kube-system
    chart: ./k8s_security_enhancement/charts/metrics-server-3.11.0.tgz
    values:
      - args:
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

  # ---------------------------------------------------------------------------
  # 2. Ingress Controller (AWS NLB)
  # ---------------------------------------------------------------------------
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ./k8s_security_enhancement/charts/ingress-nginx-4.8.1.tgz
    values:
      - controller:
          ingressClassResource:
            name: nginx
            enabled: true
            default: true
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

  # ---------------------------------------------------------------------------
  # 3. Cert-Manager (Let's Encrypt TLS)
  # ---------------------------------------------------------------------------
  - name: cert-manager
    namespace: cert-manager
    chart: ./k8s_security_enhancement/charts/cert-manager-v1.13.1.tgz
    values:
      - installCRDs: true

  # ---------------------------------------------------------------------------
  # 4. Hardened Django Application
  # ---------------------------------------------------------------------------
  - name: django-secure-app
    namespace: django-security-prod
    chart: ./k8s_security_enhancement
    needs:
      - kube-system/metrics-server
      - ingress-nginx/ingress-nginx
      - cert-manager/cert-manager
    values:
      - ./k8s_security_enhancement/values.yaml
      - ./helm_secrets/django_config.yaml
    secrets:
      - ./helm_secrets/django_secret.yaml
