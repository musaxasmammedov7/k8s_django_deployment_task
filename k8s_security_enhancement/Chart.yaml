apiVersion: v2
name: k8s_security_enhancement
description: A hardened, security-enhanced Helm chart for Django Healthchecks with Pod Security Standards (Restricted), NetworkPolicy, RBAC, and SOPS secret encryption.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - security
  - django
  - kubernetes
  - hardening
  - pod-security-standards
  - network-policy
  - rbac
maintainers:
  - name: Musa Xasmammedov
    url: https://github.com/musaxasmammedov7
dependencies:
  - name: cert-manager
    version: v1.13.1
    repository: "https://charts.jetstack.io"
  - name: ingress-nginx
    version: 4.8.1
    repository: "https://kubernetes.github.io/ingress-nginx"
  - name: metrics-server
    version: 3.11.0
    repository: "https://kubernetes-sigs.github.io/metrics-server/"
