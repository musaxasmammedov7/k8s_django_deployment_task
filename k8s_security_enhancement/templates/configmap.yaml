apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s_security_enhancement.fullname" . }}-config
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "k8s_security_enhancement.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
