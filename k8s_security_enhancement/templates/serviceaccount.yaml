{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s_security_enhancement.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "k8s_security_enhancement.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Security hardening: disable automatic token mount to prevent credential theft
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s_security_enhancement.fullname" . }}-role
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "k8s_security_enhancement.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s_security_enhancement.fullname" . }}-rolebinding
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "k8s_security_enhancement.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s_security_enhancement.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name | default .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "k8s_security_enhancement.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
